<!DOCTYPE html>
<html>
<head>
    <title>Ultimate Match 3</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body{
            margin:0;
            font-family:Arial;
            background:#1e3a5f;
            text-align:center;
            color:white;
        }

        h1{
            margin-top:20px;
        }

        .info{
            display:flex;
            justify-content:space-around;
            margin:10px;
            font-size:18px;
        }

        .board{
            width:320px;
            margin:20px auto;
            display:grid;
            grid-template-columns:repeat(8,40px);
            gap:5px;
        }

        .cell{
            width:40px;
            height:40px;
            border-radius:8px;
            cursor:pointer;
        }

        button{
            padding:10px 20px;
            font-size:16px;
            border:none;
            border-radius:8px;
            background:orange;
            margin-bottom:20px;
        }

        section{
            padding:20px;
            background:white;
            color:black;
            margin-top:20px;
        }
    </style>
</head>

<body>

<h1>Ultimate Match 3</h1>

<div class="info">
    <div>Score: <span id="score">0</span></div>
    <div>Time: <span id="timer">60</span></div>
    <div>Level: <span id="level">1</span></div>
</div>

<div class="board" id="board"></div>

<button onclick="restartGame()">Restart</button>

<section>
    <h2>About</h2>
    <p>This is a simple Match 3 puzzle game built with HTML, CSS and JavaScript.</p>

    <h2>Contact</h2>
    <p>For feedback please contact: <b>yourname@gmail.com</b></p>

    <h2>Privacy Policy</h2>
    <p>We do not collect any personal data. This game runs locally in your browser.</p>
</section>

<script>
let colors=["red","yellow","green","blue","purple"];
let board=document.getElementById("board");
let score=0;
let timeLeft=60;
let level=1;
let gameActive=true;

function randomColor(){
    return colors[Math.floor(Math.random()*colors.length)];
}

function createBoard(){
    board.innerHTML="";
    for(let i=0;i<64;i++){
        let cell=document.createElement("div");
        cell.classList.add("cell");
        cell.style.background=randomColor();
        board.appendChild(cell);
    }
}

function startTimer(){
    let timer=setInterval(function(){
        if(!gameActive){
            clearInterval(timer);
            return;
        }
        timeLeft--;
        document.getElementById("timer").innerText=timeLeft;
        if(timeLeft<=0){
            gameActive=false;
            alert("Game Over! Score: "+score);
        }
    },1000);
}

function restartGame(){
    score=0;
    timeLeft=60;
    level=1;
    gameActive=true;
    document.getElementById("score").innerText=score;
    document.getElementById("timer").innerText=timeLeft;
    document.getElementById("level").innerText=level;
    createBoard();
    startTimer();
}

createBoard();
startTimer();
</script>

</body>
</html>
