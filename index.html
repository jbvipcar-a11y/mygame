<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Match 3</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#1e3a5f;
text-align:center;
color:white;
}

h1{
margin-top:20px;
}

.info{
display:flex;
justify-content:space-around;
margin:15px;
font-size:18px;
}

.board{
width:340px;
margin:20px auto;
display:grid;
grid-template-columns:repeat(8,40px);
gap:5px;
}

.cell{
width:40px;
height:40px;
border-radius:8px;
cursor:pointer;
}

button{
padding:12px 25px;
font-size:16px;
border:none;
border-radius:8px;
background:orange;
margin-bottom:20px;
}

section{
background:white;
color:black;
padding:25px;
margin-top:30px;
}
</style>
</head>

<body>

<h1>Ultimate Match 3</h1>

<div class="info">
<div>Score: <span id="score">0</span></div>
<div>Time: <span id="timer">60</span></div>
<div>Level: <span id="level">1</span></div>
</div>

<div class="board" id="board"></div>

<button onclick="restartGame()">Restart</button>

<section>
<h2>About</h2>
<p>This is a simple Match 3 puzzle game built using HTML, CSS and JavaScript.</p>

<h2>Contact</h2>
<p>Email: yourname@gmail.com</p>

<h2>Privacy Policy</h2>
<p>We do not collect or store any personal data. This game runs locally in your browser.</p>
</section>

<script>
let colors=["red","yellow","green","blue","purple"];
let board=document.getElementById("board");
let score=0;
let timeLeft=60;
let level=1;
let gameActive=true;

function randomColor(){
return colors[Math.floor(Math.random()*colors.length)];
}

function createBoard(){
board.innerHTML="";
for(let i=0;i<64;i++){
let cell=document.createElement("div");
cell.classList.add("cell");
cell.style.background=randomColor();
board.appendChild(cell);
}
}

function startTimer(){
let timer=setInterval(function(){
if(!gameActive){
clearInterval(timer);
return;
}
timeLeft--;
document.getElementById("timer").innerText=timeLeft;

if(timeLeft<=0){
gameActive=false;
alert("Game Over! Your Score: "+score);
}
},1000);
}

function restartGame(){
score=0;
timeLeft=60;
level=1;
gameActive=true;

document.getElementById("score").innerText=score;
document.getElementById("timer").innerText=timeLeft;
document.getElementById("level").innerText=level;

createBoard();
startTimer();
}

createBoard();
startTimer();
</script>

</body>
    </html>
