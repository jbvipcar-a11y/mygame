<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Darling Pro Game</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
  text-align: center;
  color: white;
}

.container {
  margin-top: 40px;
}

h1 {
  font-size: 32px;
}

.score-box {
  margin: 10px;
  padding: 10px 20px;
  border-radius: 20px;
  background: rgba(255,255,255,0.2);
  display: inline-block;
}

button {
  padding: 15px 30px;
  font-size: 18px;
  border: none;
  border-radius: 25px;
  background: #ff4e91;
  color: white;
  cursor: pointer;
  transition: 0.3s;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

button:hover {
  transform: scale(1.1);
}

#gameArea, #gameOver {
  display: none;
}

.tap-btn {
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

<h1>💖 Darling Pro Game 💖</h1>

<div id="startScreen">
  <button onclick="startGame()">Start Game 💕</button>
</div>

<div id="gameArea">
  <div class="score-box">Score: <span id="score">0</span></div>
  <div class="score-box">Time: <span id="time">15</span></div>
  <div class="score-box">High Score: <span id="highScore">0</span></div>
  <br>
  <button class="tap-btn" onclick="addScore()">Tap Me 💓</button>
</div>

<div id="gameOver">
  <h2>Game Over 💔</h2>
  <p>Your Score: <span id="finalScore"></span></p>
  <button onclick="restartGame()">Play Again 💞</button>
</div>

</div>

<script>
let score = 0;
let timeLeft = 15;
let timer;
let highScore = localStorage.getItem("highScore") || 0;

document.getElementById("highScore").innerText = highScore;

function startGame() {
  document.getElementById("startScreen").style.display = "none";
  document.getElementById("gameOver").style.display = "none";
  document.getElementById("gameArea").style.display = "block";

  score = 0;
  timeLeft = 15;
  document.getElementById("score").innerText = score;
  document.getElementById("time").innerText = timeLeft;

  timer = setInterval(function() {
    timeLeft--;
    document.getElementById("time").innerText = timeLeft;

    if(timeLeft <= 0) {
      endGame();
    }
  }, 1000);
}

function addScore() {
  score++;
  document.getElementById("score").innerText = score;

  if(score % 10 === 0) {
    timeLeft += 3; // bonus time
  }
}

function endGame() {
  clearInterval(timer);
  document.getElementById("gameArea").style.display = "none";
  document.getElementById("gameOver").style.display = "block";
  document.getElementById("finalScore").innerText = score;

  if(score > highScore) {
    highScore = score;
    localStorage.setItem("highScore", highScore);
  }

  document.getElementById("highScore").innerText = highScore;
}

function restartGame() {
  startGame();
}
</script>

</body>
                                                </html>
