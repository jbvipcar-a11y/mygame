<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Match 3</title>

<style>
body{
    margin:0;
    font-family:Arial;
    text-align:center;
    background:linear-gradient(45deg,#141e30,#243b55);
    color:white;
}

h1{margin-top:15px;}

#info{
    display:flex;
    justify-content:space-around;
    margin:10px;
    font-size:16px;
}

.grid{
    width:320px;
    margin:20px auto;
    display:grid;
    grid-template-columns:repeat(8,40px);
    grid-gap:4px;
}

.cell{
    width:40px;
    height:40px;
    border-radius:8px;
    cursor:pointer;
    transition:0.2s;
}

.cell:active{
    transform:scale(0.9);
}

button{
    padding:10px 20px;
    border:none;
    border-radius:8px;
    background:orange;
    font-size:16px;
    margin-bottom:20px;
}
</style>
</head>

<body>

<h1>Ultimate Match 3</h1>

<div id="info">
    <div id="score">Score: 0</div>
    <div id="timer">Time: 60</div>
    <div id="level">Level: 1</div>
</div>

<p id="highscore">High Score: 0</p>

<div class="grid" id="grid"></div>
<button onclick="restartGame()">Restart</button>

<script>
const width = 8;
const colors = ["red","blue","green","yellow","purple"];

let squares = [];
let score = 0;
let timeLeft = 60;
let level = 1;
let firstClick = null;
let gameActive = true;
let timerInterval = null;

const grid = document.getElementById("grid");
let highScore = localStorage.getItem("highScore") || 0;
document.getElementById("highscore").innerText="High Score: "+highScore;

// Create Board
function createBoard(){
    grid.innerHTML="";
    squares=[];

    for(let i=0;i<width*width;i++){
        const square=document.createElement("div");
        square.classList.add("cell");
        square.style.backgroundColor=randomColor();
        square.dataset.bomb="false";

        grid.appendChild(square);
        squares.push(square);

        square.addEventListener("click",handleClick);
    }
}

function randomColor(){
    return colors[Math.floor(Math.random()*colors.length)];
}

// Click
function handleClick(){
    if(!gameActive) return;

    if(this.dataset.bomb==="true"){
        explodeBomb(this);
        return;
    }

    if(!firstClick){
        firstClick=this;
        this.style.border="2px solid white";
    }else{
        let secondClick=this;
        firstClick.style.border="none";

        swapColors(firstClick,secondClick);

        if(!checkMatches()){
            swapColors(firstClick,secondClick);
        }

        firstClick=null;
    }
}

// Swap
function swapColors(a,b){
    let temp=a.style.backgroundColor;
    a.style.backgroundColor=b.style.backgroundColor;
    b.style.backgroundColor=temp;
}

// Check Matches
function checkMatches(){
    let match=false;

    // Row match 3
    for(let i=0;i<64;i++){
        if(i%width > 5) continue;

        let row=[i,i+1,i+2];
        let color=squares[i].style.backgroundColor;

        if(color && row.every(index=>squares[index].style.backgroundColor===color)){
            row.forEach(index=>squares[index].style.backgroundColor="");
            score+=10*level;
            match=true;
        }
    }

    // Column match 3
    for(let i=0;i<48;i++){
        let col=[i,i+width,i+width*2];
        let color=squares[i].style.backgroundColor;

        if(color && col.every(index=>squares[index].style.backgroundColor===color)){
            col.forEach(index=>squares[index].style.backgroundColor="");
            score+=10*level;
            match=true;
        }
    }

    // Bomb match 4 row
    for(let i=0;i<64;i++){
        if(i%width > 4) continue;

        let row=[i,i+1,i+2,i+3];
        let color=squares[i].style.backgroundColor;

        if(color && row.every(index=>squares[index].style.backgroundColor===color)){
            squares[i+1].dataset.bomb="true";
            squares[i+1].innerHTML="💣";
            score+=40*level;
            match=true;
        }
    }

    updateScore();

    if(match){
        setTimeout(refillBoard,200);
    }

    return match;
}

function explodeBomb(square){
    let index=squares.indexOf(square);
    let neighbors=[index,index-1,index+1,index-width,index+width];

    neighbors.forEach(i=>{
        if(squares[i]){
            squares[i].style.backgroundColor="";
            squares[i].innerHTML="";
            squares[i].dataset.bomb="false";
        }
    });

    score+=50;
    updateScore();
    setTimeout(refillBoard,200);
}

function refillBoard(){
    squares.forEach(square=>{
        if(square.style.backgroundColor===""){
            square.style.backgroundColor=randomColor();
            square.innerHTML="";
            square.dataset.bomb="false";
        }
    });
}

function updateScore(){
    document.getElementById("score").innerText="Score: "+score;

    if(score>=level*300){
        level++;
        document.getElementById("level").innerText="Level: "+level;
    }
}

function startTimer(){
    if(timerInterval) clearInterval(timerInterval);

    timerInterval=setInterval(()=>{
        if(!gameActive) return;

        timeLeft--;
        document.getElementById("timer").innerText="Time: "+timeLeft;

        if(timeLeft<=0){
            gameActive=false;

            if(score>highScore){
                highScore=score;
                localStorage.setItem("highScore",score);
                document.getElementById("highscore").innerText="High Score: "+score;
            }

            alert("Game Over! Final Score: "+score);
            clearInterval(timerInterval);
        }
    },1000);
}

function restartGame(){
    score=0;
    timeLeft=60;
    level=1;
    gameActive=true;

    document.getElementById("score").innerText="Score: 0";
    document.getElementById("timer").innerText="Time: 60";
    document.getElementById("level").innerText="Level: 1";

    createBoard();
    startTimer();
}

createBoard();
startTimer();
</script>

</body>
</html>
