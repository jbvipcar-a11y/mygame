<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Click Master Ultra</title>

<style>
body{
  margin:0;
  font-family:Arial;
  text-align:center;
  transition:0.5s;
}

.dark{
  background:#111;
  color:white;
}

.neon{
  background:black;
  color:#0ff;
}

.container{ padding:20px; }

button{
  padding:12px 25px;
  margin:5px;
  border:none;
  border-radius:25px;
  cursor:pointer;
  font-size:16px;
}

.mainBtn{
  font-size:20px;
  background:#00c6ff;
  color:white;
}

.bomb{ background:red; color:white; }
.fake{ background:gray; color:white; }

.shop{
  background:rgba(255,255,255,0.1);
  padding:10px;
  border-radius:10px;
  margin-top:10px;
}

.hidden{ display:none; }

.floating{
  position:absolute;
  font-weight:bold;
  animation:float 1s forwards;
}

@keyframes float{
  0%{ opacity:1; transform:translateY(0); }
  100%{ opacity:0; transform:translateY(-50px); }
}
</style>
</head>

<body class="dark">

<div class="container">

<h2>🔥 Click Master Ultra 2.0 🔥</h2>

<p>Score: <span id="score">0</span> | Coins: <span id="coins">0</span> | Level: <span id="level">1</span></p>
<p>High Score: <span id="high">0</span></p>

<button onclick="startGame()">Start</button>
<button onclick="pauseGame()">Pause</button>
<button onclick="toggleSound()">Sound</button>
<button onclick="switchTheme()">Switch Theme</button>

<div id="gameArea" class="hidden">
  <button id="mainBtn" class="mainBtn" onclick="addScore()">TAP!</button>
  <button id="bombBtn" class="bomb hidden" onclick="bomb()">💣</button>
  <button id="fakeBtn" class="fake hidden" onclick="fake()">Fake</button>
</div>

<div class="shop">
<h3>🛒 Shop</h3>
<button onclick="buyDouble()">Double Score (20 coins)</button>
</div>

</div>

<script>
let score=0, coins=0, level=1;
let high=localStorage.getItem("high")||0;
let soundOn=true;
let paused=false;
let doubleScore=false;

document.getElementById("high").innerText=high;

function startGame(){
  score=0;
  document.getElementById("gameArea").classList.remove("hidden");
  moveButtons();
}

function addScore(){
  if(paused) return;

  let add=doubleScore?2:1;
  score+=add;
  coins++;
  level=Math.floor(score/10)+1;

  if(score>high){
    high=score;
    localStorage.setItem("high",high);
  }

  updateUI();
  showFloating("+ "+add);
}

function bomb(){
  alert("💥 Bomb! Game Over");
  resetGame();
}

function fake(){
  score--;
  if(score<0) score=0;
  updateUI();
}

function resetGame(){
  score=0;
  document.getElementById("gameArea").classList.add("hidden");
  updateUI();
}

function pauseGame(){
  paused=!paused;
}

function toggleSound(){
  soundOn=!soundOn;
  alert(soundOn?"Sound ON":"Sound OFF");
}

function switchTheme(){
  document.body.classList.toggle("neon");
  document.body.classList.toggle("dark");
}

function buyDouble(){
  if(coins>=20){
    coins-=20;
    doubleScore=true;
    alert("Double Score Activated!");
  }else{
    alert("Not enough coins!");
  }
  updateUI();
}

function updateUI(){
  document.getElementById("score").innerText=score;
  document.getElementById("coins").innerText=coins;
  document.getElementById("level").innerText=level;
  document.getElementById("high").innerText=high;
}

function moveButtons(){
  setInterval(()=>{
    if(!paused){
      document.getElementById("bombBtn").classList.toggle("hidden");
      document.getElementById("fakeBtn").classList.toggle("hidden");
    }
  },2000);
}

function showFloating(text){
  let div=document.createElement("div");
  div.innerText=text;
  div.className="floating";
  div.style.left=(Math.random()*200+50)+"px";
  div.style.top=(Math.random()*200+200)+"px";
  document.body.appendChild(div);
  setTimeout(()=>div.remove(),1000);
}
</script>

</body>
  </html>
